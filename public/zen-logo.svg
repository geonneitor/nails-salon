<svg width="300" height="150" viewBox="0 0 300 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle subtle glow -->
  <circle cx="150" cy="75" r="60" fill="url(#paint0_linear)" fill-opacity="0.2" />
  
  <!-- Elegant Ring -->
  <circle cx="150" cy="75" r="45" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="10 5" opacity="0.6" />
  <circle cx="150" cy="75" r="42" stroke="#D4AF37" stroke-width="0.5" />
  
  <!-- Text: ZEN -->
  <text x="150" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="300" fill="#4A533E" letter-spacing="0.2em">ZEN</text>
  
  <!-- Accent Detail (a small gold dot/pebble) -->
  <circle cx="150" cy="95" r="2" fill="#D4AF37" />
  
  <defs>
    <linearGradient id="paint0_linear" x1="150" y1="15" x2="150" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4AF37" />
